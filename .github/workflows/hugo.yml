name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - master  # blog 仓库的主分支

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout blog repository
        uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.111.3'
          extended: true

      - name: Build with Hugo
        run: hugo --minify

      - name: Deploy to mayf3.github.io
        uses: peaceiris/actions-gh-pages@v3
        with:
          # GITHUB_TOKEN 无法跨仓库推送（2026-08-07 起全部失败），改用 DEPLOY_KEY
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          publish_dir: ./public
          publish_branch: main  # mayf3.github.io 的 Pages 服务分支是 main（不是 master）
          external_repository: mayf3/mayf3.github.io
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
